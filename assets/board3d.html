<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <!-- three.min.js must be placed alongside this file in assets/. See README. -->
  <script src="three.min.js"></script>
  <script>
    // ---------------------------------------------------------------
    // Local, offline 3D chess board renderer.
    // Communicates with the Flutter side via a JavaScript channel:
    //   Flutter -> JS : window.updateBoard(stateJson)
    //   JS -> Flutter : BoardChannel.postMessage(eventJson)
    // No network calls of any kind happen here.
    // ---------------------------------------------------------------

    const FILES = ['a','b','c','d','e','f','g','h'];
    let scene, camera, renderer, raycaster, pointer;
    let squareMeshes = {};   // square name -> mesh (for highlight color reset)
    let pieceMeshes = {};    // square name -> piece group
    let boardGroup, piecesGroup, highlightGroup;
    let flipped = false;

    const COLORS = {
      light: 0xEEEED2,
      dark: 0x769656,
      selected: 0xF6F669,
      legal: 0x888888,
      hintSource: 0x3399FF,
      hintDest: 0x33CC66,
      whitePiece: 0xF5F5F5,
      blackPiece: 0x222222,
    };

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1b1b1b);

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
      setCameraForOrientation();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.6);
      dir.position.set(5, 10, 7);
      scene.add(dir);

      boardGroup = new THREE.Group();
      piecesGroup = new THREE.Group();
      highlightGroup = new THREE.Group();
      scene.add(boardGroup);
      scene.add(piecesGroup);
      scene.add(highlightGroup);

      buildBoard();

      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();
      renderer.domElement.addEventListener('pointerdown', onPointerDown, false);
      window.addEventListener('resize', onResize, false);

      animate();
    }

    function setCameraForOrientation() {
      // Camera sits above and to one side, looking at the board center,
      // matching whichever player's turn it currently is.
      if (flipped) {
        camera.position.set(0, 6, -7);
      } else {
        camera.position.set(0, 6, 7);
      }
      camera.lookAt(0, 0, 0);
    }

    function squareToWorld(file, rank) {
      // Board centered at origin, squares are 1x1 units, files a-h -> x -3.5..3.5
      const x = FILES.indexOf(file) - 3.5 + 0.5;
      const z = (rank - 1) - 3.5 + 0.5;
      return { x, z };
    }

    function buildBoard() {
      for (let r = 1; r <= 8; r++) {
        for (let f = 0; f < 8; f++) {
          const file = FILES[f];
          const isDark = (r + f) % 2 === 0;
          const geo = new THREE.BoxGeometry(1, 0.2, 1);
          const mat = new THREE.MeshStandardMaterial({
            color: isDark ? COLORS.dark : COLORS.light,
          });
          const mesh = new THREE.Mesh(geo, mat);
          const { x, z } = squareToWorld(file, r);
          mesh.position.set(x, -0.1, z);
          mesh.userData.square = `${file}${r}`;
          mesh.userData.baseColor = isDark ? COLORS.dark : COLORS.light;
          boardGroup.add(mesh);
          squareMeshes[`${file}${r}`] = mesh;
        }
      }
    }

    // --- Piece geometry: simple, distinguishable primitives per piece type ---
    function buildPieceMesh(pieceCode) {
      const isWhite = pieceCode === pieceCode.toUpperCase();
      const color = isWhite ? COLORS.whitePiece : COLORS.blackPiece;
      const mat = new THREE.MeshStandardMaterial({ color });
      const type = pieceCode.toLowerCase();
      const group = new THREE.Group();

      let bodyGeo;
      let height = 0.6;
      switch (type) {
        case 'p': bodyGeo = new THREE.ConeGeometry(0.25, 0.5, 12); height = 0.25; break;
        case 'r': bodyGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.55, 8); height = 0.28; break;
        case 'n': bodyGeo = new THREE.ConeGeometry(0.26, 0.65, 4); height = 0.33; break;
        case 'b': bodyGeo = new THREE.ConeGeometry(0.25, 0.75, 16); height = 0.38; break;
        case 'q': bodyGeo = new THREE.CylinderGeometry(0.1, 0.35, 0.85, 16); height = 0.43; break;
        case 'k': bodyGeo = new THREE.CylinderGeometry(0.12, 0.35, 0.95, 16); height = 0.48; break;
        default: bodyGeo = new THREE.BoxGeometry(0.4, 0.5, 0.4); height = 0.25;
      }
      const body = new THREE.Mesh(bodyGeo, mat);
      body.position.y = height;
      group.add(body);

      // Base disc for visual grounding
      const baseGeo = new THREE.CylinderGeometry(0.32, 0.34, 0.08, 16);
      const base = new THREE.Mesh(baseGeo, mat);
      base.position.y = 0.04;
      group.add(base);

      // King gets a small cross topper so it's identifiable at a glance.
      if (type === 'k') {
        const crossMat = mat;
        const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.05), crossMat);
        vBar.position.y = height + 0.55;
        const hBar = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.05), crossMat);
        hBar.position.y = height + 0.5;
        group.add(vBar, hBar);
      }

      return group;
    }

    function clearPieces() {
      for (const key in pieceMeshes) {
        piecesGroup.remove(pieceMeshes[key]);
      }
      pieceMeshes = {};
    }

    function renderPieces(boardMap) {
      // boardMap: { "e4": "P", "e7": "p", ... }
      clearPieces();
      for (const square in boardMap) {
        const code = boardMap[square];
        if (!code) continue;
        const file = square[0];
        const rank = parseInt(square[1], 10);
        const mesh = buildPieceMesh(code);
        const { x, z } = squareToWorld(file, rank);
        mesh.position.set(x, 0, z);
        piecesGroup.add(mesh);
        pieceMeshes[square] = mesh;
      }
    }

    function clearHighlights() {
      while (highlightGroup.children.length) {
        highlightGroup.remove(highlightGroup.children[0]);
      }
      for (const sq in squareMeshes) {
        squareMeshes[sq].material.color.setHex(squareMeshes[sq].userData.baseColor);
      }
    }

    function addRingHighlight(square, colorHex) {
      const file = square[0];
      const rank = parseInt(square[1], 10);
      const { x, z } = squareToWorld(file, rank);
      const geo = new THREE.RingGeometry(0.32, 0.42, 24);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(geo, mat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(x, 0.02, z);
      highlightGroup.add(ring);
    }

    function applyHighlights(state) {
      clearHighlights();
      if (state.selectedSquare) {
        squareMeshes[state.selectedSquare].material.color.setHex(COLORS.selected);
      }
      (state.legalTargets || []).forEach(sq => addRingHighlight(sq, COLORS.legal));
      if (state.hintSource) squareMeshes[state.hintSource].material.color.setHex(COLORS.hintSource);
      if (state.hintDest) squareMeshes[state.hintDest].material.color.setHex(COLORS.hintDest);
    }

    // --- Called from Flutter whenever game state changes ---
    window.updateBoard = function(stateJson) {
      const state = JSON.parse(stateJson);
      if (typeof state.flipped === 'boolean' && state.flipped !== flipped) {
        flipped = state.flipped;
        setCameraForOrientation();
      }
      renderPieces(state.board || {});
      applyHighlights(state);
    };

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(boardGroup.children);
      if (intersects.length > 0) {
        const square = intersects[0].object.userData.square;
        if (window.BoardChannel) {
          window.BoardChannel.postMessage(JSON.stringify({ type: 'tap', square }));
        }
      }
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
