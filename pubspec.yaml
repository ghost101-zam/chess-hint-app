name: chess_hint_app
description: Offline local two-player chess with a shared, visible text hint system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  chess: ^0.8.1          # Pure-Dart chess rules engine (move generation/validation)
  flutter_stockfish: ^0.3.0   # Native Stockfish binding (Android/iOS). See README for setup.
  webview_flutter: ^4.7.0     # Hosts the local (offline) Three.js 3D board scene
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/board3d.html
    - assets/three.min.js
