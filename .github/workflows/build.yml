name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fill in missing native Android scaffolding
        run: flutter create --platforms=android .

      - name: Fetch three.min.js (offline-bundled at build time, not runtime)
        run: curl -L -o assets/three.min.js https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/build/three.min.js

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-hint-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
