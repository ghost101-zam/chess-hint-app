name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fill in missing native Android scaffolding
        run: flutter create --platforms=android --project-name chess_hint_app .

      - name: Pin Android Gradle Plugin to satisfy Flutter's minimum
        run: sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "9.0.1"/' android/settings.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Patch stockfish plugin's deprecated jcenter() call
        run: sed -i 's/jcenter()/mavenCentral()/' "$HOME/.pub-cache/hosted/pub.dev/stockfish-"*/android/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-hint-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
